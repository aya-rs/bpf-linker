name: CI

on:
  push:

  pull_request:

  release:
    types: [published]

  schedule:
    # Run the full nightly build daily at 04:00 UTC.
    - cron: 00 4 * * *

env:
  # This key is intentionally public so fork pull requests can use BuildBuddy.
  BUILDBUDDY_API_KEY: 5CeVmFS0jDnutd00x9Xl
  CARGO_TERM_COLOR: always
  TAG_PREFIX: ghcr.io/${{ github.repository_owner }}/llvm
  # Suffix used to distinguish incompatible LLVM build variants.
  # This lets us roll out changes to the LLVM build in a pull request
  # without conflicting with artifacts produced on the main branch.
  LLVM_BUILD_REV: 3

permissions: {}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    permissions:
      # Read the nightly rustc's LLVM submodule and the current checkout.
      contents: read
    outputs:
      artifact-id: ${{ steps.nightly-artifact.outputs.artifact-id }}
      llvm-commit: ${{ steps.nightly-update.outputs.llvm-commit || steps.nightly-pins.outputs.llvm-commit }}
      rust-toolchain: ${{ steps.nightly-update.outputs.rust-toolchain || steps.nightly-pins.outputs.rust-toolchain }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the pinned nightly toolchains
        id: nightly-pins
        run: |
          set -euo pipefail

          rust_toolchain=$(
            sed -nE '/^toolchains\.toolchain\(/,/^\)/s@^[[:space:]]*version[[:space:]]*=[[:space:]]*"nightly/([0-9]{4}-[0-9]{2}-[0-9]{2})",[[:space:]]*$@nightly-\1@p' \
              MODULE.bazel
          )
          llvm_commit=$(
            sed -nE '/^llvm_source\.from_archive\(/,/^\)/s@^[[:space:]]*urls[[:space:]]*=[[:space:]]*\["https://github\.com/rust-lang/llvm-project/archive/([0-9a-f]{40})\.tar\.gz"\],[[:space:]]*$@\1@p' \
              MODULE.bazel
          )
          [[ $rust_toolchain =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ $llvm_commit =~ ^[0-9a-f]{40}$ ]]
          echo "rust-toolchain=$rust_toolchain" >> "$GITHUB_OUTPUT"
          echo "llvm-commit=$llvm_commit" >> "$GITHUB_OUTPUT"

      # Pull requests use the pinned nightly; default-branch runs advance it.
      - name: Update the nightly pins
        id: nightly-update
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_LLVM_COMMIT: ${{ steps.nightly-pins.outputs.llvm-commit }}
          PINNED_RUST_TOOLCHAIN: ${{ steps.nightly-pins.outputs.rust-toolchain }}
        run: |
          set -euo pipefail

          nightly=$(
            curl -fsSL --retry 5 https://static.rust-lang.org/dist/channel-rust-nightly.toml |
              yq --exit-status --input-format toml \
                'select(.date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) |
                 select(.pkg.rustc.git_commit_hash | test("^[0-9a-f]{40}$")) |
                 "\(.date) \(.pkg.rustc.git_commit_hash)"'
          )
          read -r nightly_date rustc_commit <<< "$nightly"
          [[ $nightly_date =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ $rustc_commit =~ ^[0-9a-f]{40}$ ]]

          llvm_commit=$(gh api \
            "repos/rust-lang/rust/contents/src/llvm-project?ref=$rustc_commit" \
            --jq 'select(.type == "submodule" and .submodule_git_url == "https://github.com/rust-lang/llvm-project.git") | .sha')
          [[ $llvm_commit =~ ^[0-9a-f]{40}$ ]]

          if [[ $PINNED_RUST_TOOLCHAIN == "nightly-$nightly_date" &&
                $PINNED_LLVM_COMMIT == "$llvm_commit" ]]; then
            exit 0
          fi

          buildozer=(bazel --ignore_all_rc_files run -- @buildifier_prebuilt//:buildozer)
          commands=(
            "set version \"nightly/$nightly_date\"|//MODULE.bazel:%toolchains.toolchain"
          )

          if [[ $PINNED_LLVM_COMMIT != "$llvm_commit" ]]; then
            llvm_archive_url="https://github.com/rust-lang/llvm-project/archive/$llvm_commit.tar.gz"
            llvm_version_url="https://raw.githubusercontent.com/rust-lang/llvm-project/$llvm_commit/cmake/Modules/LLVMVersion.cmake"
            llvm_version=$(
              curl -fsSL --retry 5 "$llvm_version_url" |
                sed -nE 's/^[[:space:]]*set\(LLVM_VERSION_(MAJOR|MINOR|PATCH)[[:space:]]+([0-9]+)\)[[:space:]]*$/\2/p' |
                paste -sd . -
            )
            supported_llvm_version=$("${buildozer[@]}" \
              'print llvm_version' '//MODULE.bazel:%llvm_source.version')
            [[ $llvm_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ $supported_llvm_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            if [[ ${llvm_version%%.*} != "${supported_llvm_version%%.*}" ]]; then
              echo "::notice::Rust nightly uses unsupported LLVM $llvm_version; keeping LLVM $supported_llvm_version."
              exit 0
            fi

            archive="$RUNNER_TEMP/llvm-project.tar.gz"
            curl -fsSL --retry 5 -o "$archive" "$llvm_archive_url"
            integrity="sha256-$(openssl dgst -sha256 -binary "$archive" | base64 -w0)"
            commands+=(
              "set llvm_version \"$llvm_version\"|//MODULE.bazel:%llvm_source.version"
              "set integrity \"$integrity\"|//MODULE.bazel:%llvm_source.from_archive"
              "set strip_prefix \"llvm-project-$llvm_commit\"|//MODULE.bazel:%llvm_source.from_archive"
              "set urls [\"$llvm_archive_url\"]|//MODULE.bazel:%llvm_source.from_archive"
            )
          fi

          printf '%s\n' "${commands[@]}" | "${buildozer[@]}" -f -
          bazel mod tidy
          git diff --check
          echo 'updated=true' >> "$GITHUB_OUTPUT"
          echo "rust-toolchain=nightly-$nightly_date" >> "$GITHUB_OUTPUT"
          echo "llvm-commit=$llvm_commit" >> "$GITHUB_OUTPUT"

      - name: Upload the nightly candidate
        id: nightly-artifact
        if: steps.nightly-update.outputs.updated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rust-nightly-candidate-${{ github.run_id }}
          path: |
            MODULE.bazel
            MODULE.bazel.lock
          if-no-files-found: error
          retention-days: 1

  llvm:
    needs: prepare
    permissions:
      # Needed to upload LLVM binaries as OCI artifacts to GHCR.
      packages: write
    runs-on: ${{ matrix.platform.os }}
    name: llvm
    strategy:
      matrix:
        platform:
          - os: macos-latest
            target: aarch64-apple-darwin
            c-compiler: clang
            cxx-compiler: clang++
          - os: macos-15-intel
            target: x86_64-apple-darwin
            c-compiler: clang
            cxx-compiler: clang++
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            c-compiler: clang
            cxx-compiler: clang++
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            c-compiler: aarch64-linux-musl-clang
            cxx-compiler: aarch64-linux-musl-clang++
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            c-compiler: clang
            cxx-compiler: clang++
            libdir: lib64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            c-compiler: x86_64-linux-musl-clang
            cxx-compiler: x86_64-linux-musl-clang++
        llvm:
          - version: 20
            git-ref: rustc/20.1-2025-02-13
          - version: 21
            git-ref: rustc/21.1-2025-08-01
          - version: 22
            git-ref: rustc/22.1-2026-05-19
    steps:
      - name: Resolve the LLVM source
        id: llvm-source
        env:
          LLVM_VERSION: ${{ matrix.llvm.version }}
          LLVM_REF: ${{ matrix.llvm.git-ref }}
          NIGHTLY_LLVM_COMMIT: ${{ needs.prepare.outputs.llvm-commit }}
        run: |
          set -euo pipefail

          if [[ $LLVM_VERSION == 22 ]]; then
            repository=rust-lang/llvm-project
            llvm_commit=$NIGHTLY_LLVM_COMMIT
          else
            repository=aya-rs/llvm-project
            llvm_commit=$(
              git ls-remote "https://github.com/$repository.git" \
                "refs/heads/$LLVM_REF" | cut -f1
            )
          fi

          [[ $llvm_commit =~ ^[0-9a-f]{40}$ ]]
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "commit=$llvm_commit" >> "$GITHUB_OUTPUT"

      - id: llvm-image
        run: |
          set -euxo pipefail
          # Tag based on the LLVM git commit SHA. Used by the `llvm-cache`
          # step to pull the exact build for this source revision.
          echo "sha=${{ env.TAG_PREFIX }}:${{ steps.llvm-source.outputs.commit }}-${{ matrix.platform.target }}-${{ env.LLVM_BUILD_REV }}" >> "$GITHUB_OUTPUT"
          # Tag based on the LLVM version. Used by the other CI jobs to pull the
          # expected artifact for this platform.
          echo "version=${{ env.TAG_PREFIX }}:${{ matrix.llvm.version }}-${{ matrix.platform.target }}-${{ env.LLVM_BUILD_REV }}" >> "$GITHUB_OUTPUT"

      - uses: oras-project/setup-oras@v2

      - name: Login to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          oras login ghcr.io --username "${{ github.actor }}" --password-stdin <<< "$GH_TOKEN"

      - name: Download LLVM artifact
        id: llvm-cache
        continue-on-error: true
        run: |
          oras pull "${{ steps.llvm-image.outputs.sha }}"

      - uses: actions/checkout@v7
        if: steps.llvm-cache.outcome != 'success'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.llvm-cache.outcome != 'success'

      - name: Install Tools
        if: steps.llvm-cache.outcome != 'success' && runner.os == 'Linux'
        run: |
          set -euxo pipefail
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | \
            gpg --dearmor - | \
            sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' | \
            sudo tee /etc/apt/sources.list.d/kitware.list >/dev/null

          sudo apt update
          sudo apt -y install cmake ninja-build clang lld

      - name: Install tools
        if: steps.llvm-cache.outcome != 'success' && runner.os == 'macOS'
        run: |
          set -euxo pipefail
          brew bundle
          echo "$(brew --prefix lld)/bin" >> $GITHUB_PATH

      - name: Prepare sysroot
        if: steps.llvm-cache.outcome != 'success' && endsWith(matrix.platform.target, 'musl')
        run: |
          set -euxo pipefail
          sudo apt -y install bubblewrap
          target="${{ matrix.platform.target }}"
          arch="${target%%-*}"
          ./ci/prepare-musl-sysroot.py \
            "$arch" \
            sysroot >> $GITHUB_ENV
          echo "$(pwd)/ci" >> $GITHUB_PATH

      - name: Checkout LLVM Source
        if: steps.llvm-cache.outcome != 'success'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.llvm-source.outputs.repository }}
          ref: ${{ steps.llvm-source.outputs.commit }}
          path: llvm-project

      - name: Build LLVM
        if: steps.llvm-cache.outcome != 'success'
        run: |
          set -euxo pipefail
          target="${{ matrix.platform.target }}"
          arch="${target%%-*}"
          # `--system-name` is necessary to make CMake aware that we are cross
          # compiling.
          cargo xtask build-llvm \
            --src-dir llvm-project \
            --build-dir llvm-build \
            --install-prefix "${{ github.workspace }}/llvm-install" \
            ${{ matrix.platform.libdir && format('--install-libdir {0}', matrix.platform.libdir) }} \
            --c-compiler "${{ matrix.platform.c-compiler }}" \
            --cxx-compiler "${{ matrix.platform.cxx-compiler }}" \
            ${{ endsWith(matrix.platform.target, 'musl') && format('--cmake-system-processor "$arch" --cmake-system-name Linux --sysroot {0}/sysroot', github.workspace) || '' }}

      - name: Package LLVM artifact
        if: steps.llvm-cache.outcome != 'success'
        run: |
          set -euxo pipefail
          tar --zstd -C "$GITHUB_WORKSPACE/llvm-install" -cf llvm-install.tar.zst .

      - name: Publish LLVM OCI artifact
        # GitHub does not allow foreign-repository pull requests to push
        # container images. Attempting to do so fails with:
        #
        #   Error response from registry: denied: installation not allowed to
        #   Write organization package
        #
        # Disable artifact publishing for forked pull requests. This
        # restriction is a reasonable security measure.
        if: steps.llvm-cache.outcome != 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -euxo pipefail
          oras push "${{ steps.llvm-image.outputs.sha }}" \
            --artifact-type application/vnd.aya.llvm.install \
            llvm-install.tar.zst:application/vnd.aya.llvm.install.layer.v1.tar+zstd

          # Candidate LLVM must not replace a version tag used by other runs.
          if [[ ${{ matrix.llvm.version }} != 22 ]]; then
            oras tag "${{ steps.llvm-image.outputs.sha }}" "${{ steps.llvm-image.outputs.version }}"
          fi

      - name: Publish validated LLVM version
        if: >-
          matrix.llvm.version == 22 &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          needs.prepare.outputs.artifact-id == ''
        run: |
          set -euxo pipefail
          oras tag "${{ steps.llvm-image.outputs.sha }}" "${{ steps.llvm-image.outputs.version }}"

  lint-stable:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rust-src

      - name: Run clippy
        run: cargo clippy --features llvm-22,no-llvm-linking --all-targets --workspace -- --deny warnings

  lint-nightly:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.prepare.outputs.rust-toolchain }}
          components: rustfmt, rust-src

      - name: Check formatting
        run: cargo fmt --all -- --check

  bazel:
    needs: prepare
    name: bazel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Download the nightly candidate
        if: needs.prepare.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}

      - name: Test
        run: |
          set -euo pipefail
          bazel test //... \
            --config=remote \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"

  build:
    permissions:
      # Needed to pull LLVM binaries as OCI artifacts from GHCR.
      packages: read
    runs-on: ${{ matrix.platform.os }}
    # We work with two git repositories in this workflow:
    #
    # - bpf-linker
    # - aya (for integration tests)
    #
    # Cargo searches for `.cargo` directories recursively in all parent
    # directories. Therefore, nesting different Rust projects with their own
    # `.cargo/config.toml` files in the same hierarchy (one nested in another)
    # causes cargo to read and merge both configurations.
    #
    # To avoid that, we clone both repositories in separate directories inside
    # the workspace.
    defaults:
      run:
        working-directory: bpf-linker
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - rust: 1.90.0
            llvm: 20
            exclude-features: default,llvm-21,llvm-22
          - rust: 1.94.0
            llvm: 21
            exclude-features: default,llvm-20,llvm-22
          - rust: stable
            llvm: 22
            exclude-features: llvm-20,llvm-21
          - rust: beta
            llvm: 22
            exclude-features: llvm-20,llvm-21
          - rust: nightly
            llvm: 22
            exclude-features: llvm-20,llvm-21
        platform:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          # We don't use ubuntu-latest because we care about the apt packages available.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    name: target=${{ matrix.platform.target }} rustc=${{ matrix.toolchain.rust }} llvm=${{ matrix.toolchain.llvm }}
    needs:
      - prepare
      - llvm

    env:
      RUST_BACKTRACE: full
      # Keep Cargo nightly on the dated toolchain selected by MODULE.bazel.
      RUST_TOOLCHAIN: ${{ matrix.toolchain.rust == 'nightly' && needs.prepare.outputs.rust-toolchain || matrix.toolchain.rust }}
      # Features that have to be included for dynamic linking.
      LLVM_FEATURES_DYNAMIC: llvm-${{ matrix.toolchain.llvm }}
      # Features that have to be included for static linking.
      LLVM_FEATURES_STATIC: llvm-${{ matrix.toolchain.llvm }},llvm-link-static
      # Features that have to be excluded when running `cargo hack --feature-powerset`
      # and intending to link dynamically.
      LLVM_EXCLUDE_FEATURES_DYNAMIC: llvm-link-static,no-llvm-linking
      LATEST_LLVM: 22

    steps:
      - uses: actions/checkout@v7
        with:
          path: bpf-linker

      - name: Install Rust ${{ matrix.toolchain.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.platform.target }}
          components: rust-src

      - name: Add clang to PATH
        if: runner.os == 'Linux'
        # ubuntu-22.04 comes with clang 13-15[0]; support for signed and 64bit
        # enum values was added in clang 15[1] which isn't in `$PATH`.
        #
        # [0] https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2204-Readme.md
        #
        # [1] https://github.com/llvm/llvm-project/commit/dc1c43d
        run: echo /usr/lib/llvm-15/bin >> $GITHUB_PATH

      - name: Prepare sysroot
        if: endsWith(matrix.platform.target, 'musl')
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt -y install bubblewrap
          target="${{ matrix.platform.target }}"
          arch="${target%%-*}"
          ./ci/prepare-musl-sysroot.py \
            "$arch" \
            sysroot \
            "$RUST_TOOLCHAIN" >> $GITHUB_ENV
          echo "$(pwd)/ci" >> $GITHUB_PATH

      - name: Enforce dynamic linking
        run: echo "RUSTFLAGS=-C target-feature=-crt-static" >> $GITHUB_ENV

      - name: Install btfdump
        if: ${{ !endsWith(matrix.platform.target, 'musl') }}
        run: cargo install btfdump

      - uses: oras-project/setup-oras@v2

      - name: Login to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          oras login ghcr.io --username "${{ github.actor }}" --password-stdin <<< "$GH_TOKEN"

      - name: Restore LLVM from ghcr.io
        env:
          LLVM_COMMIT: ${{ needs.prepare.outputs.llvm-commit }}
          LLVM_VERSION: ${{ matrix.toolchain.llvm }}
          NIGHTLY_CANDIDATE: ${{ needs.prepare.outputs.artifact-id }}
        run: |
          set -euxo pipefail
          if [[ $LLVM_VERSION == 22 && -n $NIGHTLY_CANDIDATE ]]; then
            ref="${{ env.TAG_PREFIX }}:${LLVM_COMMIT}-${{ matrix.platform.target }}-${{ env.LLVM_BUILD_REV }}"
          else
            ref="${{ env.TAG_PREFIX }}:${LLVM_VERSION}-${{ matrix.platform.target }}-${{ env.LLVM_BUILD_REV }}"
          fi
          digest=$(oras manifest fetch "$ref" | jq -r '.layers[0].digest')
          # Make sure LLVM is available from the current directory, so
          # bubblewrap is able to access it. See the `ci/*-run` scripts.
          LLVM_INSTALL_DIR="$(pwd)/llvm-install"
          mkdir -p "$LLVM_INSTALL_DIR"
          oras blob fetch "${ref}@${digest}" --output - | tar --zstd -xf - -C "$LLVM_INSTALL_DIR"
          echo "${LLVM_INSTALL_DIR}/bin" >> $GITHUB_PATH

      # llvm-sys discovers link flags at build script time; these are cached by cargo. The cached
      # flags may be incorrect when the cache is reused across LLVM versions.
      - name: Bust llvm-sys cache
        run: |
          set -euxo pipefail
          cargo clean --target ${{ matrix.platform.target }} -p llvm-sys
          cargo clean --target ${{ matrix.platform.target }} -p llvm-sys --release

      - name: Check (default features)
        if: matrix.toolchain.llvm == env.LATEST_LLVM
        run: cargo check --target ${{ matrix.platform.target }}

      - name: Build (default features)
        if: matrix.toolchain.llvm == env.LATEST_LLVM
        run: cargo build --target ${{ matrix.platform.target }}

      - uses: taiki-e/install-action@cargo-hack

      - name: Check (dynamic linking, feature powerset)
        run: |
          cargo hack --target ${{ matrix.platform.target }} \
            check --feature-powerset --exclude-features \
            ${{ env.LLVM_EXCLUDE_FEATURES_DYNAMIC }},${{ matrix.toolchain.exclude-features }},${{ matrix.platform.exclude-features }} \
            --features ${{ env.LLVM_FEATURES_DYNAMIC }}

      - name: Build (dynamic linking, feature powerset)
        run: |
          cargo hack --target ${{ matrix.platform.target }} \
            hack build --feature-powerset --exclude-features \
            ${{ env.LLVM_EXCLUDE_FEATURES_DYNAMIC }},${{ matrix.toolchain.exclude-features }},${{ matrix.platform.exclude-features }} \
            --features ${{ env.LLVM_FEATURES_DYNAMIC }}

      # Toolchains provided by rustup include standard library artifacts
      # only for Tier 1 targets, which do not include BPF targets.
      #
      # The default workaround is to use the `rustc-build-sysroot` crate to
      # build a custom sysroot with the required BPF standard library before
      # running compiler tests.
      #
      # `RUSTC_BOOTSTRAP` is needed to use `rustc-build-sysroot` on stable Rust.
      - name: Test (sysroot built on demand, dynamic linking)
        run: |
          RUSTC_BOOTSTRAP=1 cargo hack --target ${{ matrix.platform.target }} \
            test --feature-powerset --exclude-features \
            ${{ env.LLVM_EXCLUDE_FEATURES_DYNAMIC }},${{ matrix.toolchain.exclude-features }},${{ matrix.platform.exclude-features }} \
            --features ${{ env.LLVM_FEATURES_DYNAMIC }}

      # To make things easier for package maintainers, the step of building a
      # custom sysroot can be skipped by setting the `BPFEL_SYSROOT_DIR`
      # environment variable to the path of the prebuilt BPF sysroot.
      #
      # Test this configuration by prebuilding the BPF standard library
      # manually.
      #
      # `RUSTC_BOOTSTRAP` is needed to make `xtask build-std` work on stable
      # Rust.
      - name: Build BPF standard library
        run: |
          set -euxo pipefail

          RUSTC_SRC="$(rustc --print sysroot)/lib/rustlib/src/rust/library"
          BPFEL_SYSROOT_DIR="$(pwd)/bpf-sysroot"
          RUSTC_BOOTSTRAP=1 cargo xtask build-std \
            --rustc-src "$RUSTC_SRC" \
            --sysroot-dir "$BPFEL_SYSROOT_DIR" \
            --target bpfel-unknown-none

      - name: Test (prebuilt BPF standard libary, dynamic linking)
        run: |
          BPFEL_SYSROOT_DIR="$(pwd)/bpf-sysroot" \
            cargo hack --target ${{ matrix.platform.target }} test \
            --feature-powerset --exclude-features \
            ${{ env.LLVM_EXCLUDE_FEATURES_DYNAMIC }},${{ matrix.toolchain.exclude-features }},${{ matrix.platform.exclude-features }} \
            --features ${{ env.LLVM_FEATURES_DYNAMIC }}

      - uses: actions/checkout@v7
        if: runner.os == 'Linux' && matrix.toolchain.rust == 'nightly'
        with:
          repository: aya-rs/aya
          path: aya
          submodules: recursive

      - name: Install (dynamic)
        if: endsWith(matrix.platform.target, 'gnu') && matrix.toolchain.rust == 'nightly'
        run: |
          cargo install --path . --no-default-features --features \
            ${{ env.LLVM_FEATURES_DYNAMIC }}

      # Even though we test both types of linking (dynamic, static) for musl
      # targets, installing a static bpf-linker for Aya integration tests is
      # just easier.
      - name: Install (static)
        if: endsWith(matrix.platform.target, 'musl') && matrix.toolchain.rust == 'nightly'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo install --target ${{ matrix.platform.target }} --path . \
            --no-default-features --features ${{ env.LLVM_FEATURES_STATIC }}

      - name: Install autopoint for aya integration tests
        if: runner.os == 'Linux' && matrix.toolchain.rust == 'nightly'
        run: sudo apt -y install autopoint

      - name: Run aya integration tests
        if: runner.os == 'Linux' && matrix.toolchain.rust == 'nightly'
        working-directory: aya
        run: |
          set -euo pipefail

          # Aya explicitly invokes `nightly`; resolve it to the pinned rustc.
          ln -s "$(rustc +"$RUST_TOOLCHAIN" --print sysroot)" \
            "$(rustup show home)/toolchains/nightly-$(rustc +"$RUST_TOOLCHAIN" --print host-tuple)"
          cargo xtask integration-test local

      - name: Install static libraries (macOS)
        if: runner.os == 'macOS'
        # macOS does not provide any static libraries. Homebrew does provide
        # them, but in custom paths that the system-wide clang is not aware of.
        # Point build.rs to them by setting environment variables.
        #
        # We install llvm package only for libc++.
        #
        # libLLVM from homebrew requires zstd.
        run: |
          set -euxo pipefail
          brew bundle
          echo "CXXSTDLIB_PATH=$(brew --prefix llvm)/lib/c++" >> $GITHUB_ENV
          echo "LIBZSTD_PATH=$(brew --prefix zstd)/lib" >> $GITHUB_ENV
          echo "ZLIB_PATH=$(brew --prefix zlib)/lib" >> $GITHUB_ENV

      - name: Enforce static linking
        # Static linking with glibc is not supported.
        if: ${{ !endsWith(matrix.platform.target, 'gnu') }}
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV

      - name: Check (static linking, single feature set)
        if: ${{ !endsWith(matrix.platform.target, 'gnu') }}
        # Static linking in combination with `cargo hack --feature-powerset`
        # (multiple builds) increases the disk usage massively. Therefore we
        # perform all static builds with only one fixed feature set.
        run: |
          cargo check --target ${{ matrix.platform.target }} \
            --no-default-features --features ${{ env.LLVM_FEATURES_STATIC }}

      - name: Build (static linking, single feature set)
        if: ${{ !endsWith(matrix.platform.target, 'gnu') }}
        run: |
          cargo build --target ${{ matrix.platform.target }} \
            --no-default-features --features ${{ env.LLVM_FEATURES_STATIC }}

      - name: Test (sysroot built on demand, static linking)
        if: ${{ !endsWith(matrix.platform.target, 'gnu') }}
        run: |
          RUSTC_BOOTSTRAP=1 cargo test --target ${{ matrix.platform.target }} \
            --no-default-features --features ${{ env.LLVM_FEATURES_STATIC }}

      - name: Test (prebuilt BPF standard library, static linking)
        if: ${{ !endsWith(matrix.platform.target, 'gnu') }}
        run: |
          BPFEL_SYSROOT_DIR="$(pwd)/bpf-sysroot" \
            cargo test --target ${{ matrix.platform.target }} \
            --no-default-features --features ${{ env.LLVM_FEATURES_STATIC }}

      - name: Report disk usage
        if: ${{ always() }}
        uses: ./bpf-linker/.github/actions/report-disk-usage

  release:
    name: release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      # Upload published GitHub release assets.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the nightly candidate
        if: needs.prepare.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}

      - name: Build release
        run: |
          set -euo pipefail

          bazel build //:release-archives \
            --config=release \
            --config=remote \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"

          mkdir -p dist
          # Rename bazel-out/<target>-opt-.../bin/bpf-linker-release[-debuginfo].tar.zst
          # to dist/bpf-linker-<target>[-debuginfo].tar.zst.
          while IFS= read -r src; do
            relative="${src#bazel-out/}"
            target="${relative%%-opt*}"
            archive_name="${src##*/}"
            archive_suffix="${archive_name#bpf-linker-release}"
            install -m 0644 "$src" "dist/bpf-linker-${target}${archive_suffix}"
          done < <(bazel cquery //:release-archives \
            --output=files \
            --config=release \
            --config=remote)

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*

  check:
    if: always()
    needs:
      - prepare
      - lint-stable
      - lint-nightly
      - bazel
      - build
      - release
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  promote:
    name: promote rust nightly
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.repository == 'aya-rs/bpf-linker' &&
      needs.prepare.outputs.artifact-id != '' &&
      needs.check.result == 'success'
    needs:
      - prepare
      - check
    concurrency: rust-nightly-${{ github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the validated nightly candidate
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}

      - name: Promote the validated nightly
        env:
          BASE_COMMIT: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.CRABBY_GITHUB_TOKEN }}
          LLVM_COMMIT: ${{ needs.prepare.outputs.llvm-commit }}
          RUST_TOOLCHAIN: ${{ needs.prepare.outputs.rust-toolchain }}
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?Expose CRABBY_GITHUB_TOKEN to this repository before enabling nightly promotion.}"

          # Compare-and-swap the tested commit, not just the nightly: a merge
          # starts a new main-branch run that must validate the candidate.
          jq -n \
            --rawfile module MODULE.bazel \
            --rawfile lock MODULE.bazel.lock \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$DEFAULT_BRANCH" \
            --arg expected "$BASE_COMMIT" \
            --arg headline "Update Rust nightly to ${RUST_TOOLCHAIN#nightly-}" \
            --arg llvm "$LLVM_COMMIT" \
            '{
              query: "mutation AdvanceRustNightly($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repository,
                    branchName: $branch
                  },
                  expectedHeadOid: $expected,
                  message: {
                    headline: $headline,
                    body: "Update both Bazel and Cargo to the validated Rust nightly.\nUse rustc LLVM commit \($llvm)."
                  },
                  fileChanges: {
                    additions: [
                      {path: "MODULE.bazel", contents: ($module | @base64)},
                      {path: "MODULE.bazel.lock", contents: ($lock | @base64)}
                    ]
                  }
                }
              }
            }' |
            gh api graphql --input - \
              --jq '.data.createCommitOnBranch.commit | "\(.oid) \(.url)"'
