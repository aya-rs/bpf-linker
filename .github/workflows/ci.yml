name: CI

on:
  push:

  pull_request:

  release:
    types: [published]

  schedule:
    # Run the full CI matrix and advance the tested nightly at 04:00 UTC.
    - cron: 00 4 * * *

env:
  # This key is intentionally public so fork pull requests can use BuildBuddy.
  BUILDBUDDY_API_KEY: 5CeVmFS0jDnutd00x9Xl
  CARGO_TERM_COLOR: always
  TAG_PREFIX: ghcr.io/${{ github.repository_owner }}/llvm
  # Suffix used to distinguish incompatible LLVM build variants.
  # This lets us roll out changes to the LLVM build in a pull request
  # without conflicting with artifacts produced on the main branch.
  LLVM_BUILD_REV: 4
  LATEST_LLVM: 22

permissions: {}

jobs:
  prepare:
    name: prepare rustc LLVM
    runs-on: ubuntu-latest
    permissions:
      # Read the checkout and rustc's LLVM submodule.
      contents: read
    outputs:
      llvm: ${{ steps.llvm.outputs.llvm }}
      module: ${{ steps.llvm-update.outputs.module }}
      llvm-commit: ${{ steps.llvm-update.outputs.llvm-commit || steps.llvm-pin.outputs.llvm-commit }}
      rust-nightly: ${{ steps.llvm-update.outputs.rust-nightly || steps.llvm-pin.outputs.rust-nightly }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the pinned rustc LLVM
        id: llvm-pin
        run: python3 scripts/update-rustc-llvm.py

      # Keep pull requests on the last validated rustc LLVM revision.
      - name: Update the pinned rustc LLVM
        id: llvm-update
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/update-rustc-llvm.py --update
          git diff --check

      - name: Configure LLVM builds
        id: llvm
        run: python3 scripts/update-rustc-llvm.py --configurations

  llvm:
    needs: prepare
    permissions:
      contents: read
      # Needed to upload LLVM binaries as OCI artifacts to GHCR.
      packages: write
    runs-on: ubuntu-latest
    name: llvm (${{ matrix.llvm }}, ${{ matrix.target }})
    strategy:
      matrix:
        llvm:
          - 21
          - 22
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - id: image-tag
        env:
          LLVM_COMMIT: ${{ fromJSON(needs.prepare.outputs.llvm)[matrix.llvm].commit }}
        run: |
          set -euxo pipefail
          # Tag based on the LLVM git commit SHA. Used by the `artifact-restore`
          # step to pull the exact build for this source revision.
          echo "sha=${{ env.TAG_PREFIX }}:${LLVM_COMMIT}-${{ matrix.target }}-${{ env.LLVM_BUILD_REV }}" >> "$GITHUB_OUTPUT"
          # Tag based on the LLVM version for local use.
          echo "version=${{ env.TAG_PREFIX }}:${{ matrix.llvm }}-${{ matrix.target }}-${{ env.LLVM_BUILD_REV }}" >> "$GITHUB_OUTPUT"

      - uses: oras-project/setup-oras@v2

      - name: Login to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          oras login ghcr.io --username "${{ github.actor }}" --password-stdin <<< "$GH_TOKEN"

      - name: Download LLVM artifact
        id: artifact-restore
        continue-on-error: true
        run: |
          oras pull "${{ steps.image-tag.outputs.sha }}"

      - uses: actions/checkout@v7
        if: steps.artifact-restore.outcome != 'success'

      - name: Apply the rustc LLVM candidate
        if: steps.artifact-restore.outcome != 'success'
        env:
          MODULE: ${{ fromJSON(needs.prepare.outputs.llvm)[matrix.llvm].module }}
        run: |
          if [[ -n $MODULE ]]; then
            printf '%s' "$MODULE" | openssl base64 -d -A > MODULE.bazel
          fi

      - name: Build and package LLVM with Bazel
        if: steps.artifact-restore.outcome != 'success'
        run: |
          set -euo pipefail
          bazel build //:llvm-archive \
            --config=release \
            --config=remote \
            --platforms=@rules_rs//rs/platforms:${{ matrix.target }} \
            --remote_timeout=120 \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"

      - name: Publish LLVM OCI artifact
        # GitHub does not allow foreign-repository pull requests to push
        # container images. Attempting to do so fails with:
        #
        #   Error response from registry: denied: installation not allowed to
        #   Write organization package
        #
        # Disable artifact publishing for forked pull requests. This
        # restriction is a reasonable security measure.
        if: steps.artifact-restore.outcome != 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: bazel-bin
        run: |
          set -euxo pipefail
          oras push "${{ steps.image-tag.outputs.sha }}" \
            --artifact-type application/vnd.aya.llvm.install \
            llvm-archive.tar.zst:application/vnd.aya.llvm.install.layer.v1.tar+zstd

      - name: Publish validated LLVM version
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (matrix.llvm != fromJSON(env.LATEST_LLVM) || needs.prepare.outputs.module == '')
        run: |
          set -euxo pipefail
          oras tag "${{ steps.image-tag.outputs.sha }}" "${{ steps.image-tag.outputs.version }}"

  lint-stable:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rust-src

      - name: Run clippy
        run: cargo clippy --features llvm-22,no-llvm-linking --all-targets --workspace -- --deny warnings

  lint-nightly:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, rust-src

      - name: Check formatting
        run: cargo fmt --all -- --check

  bazel:
    needs: prepare
    name: bazel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Each job has its own checkout; test the exact proposed module.
      - name: Apply the rustc LLVM candidate
        if: needs.prepare.outputs.module != ''
        env:
          MODULE: ${{ needs.prepare.outputs.module }}
        run: printf '%s' "$MODULE" | openssl base64 -d -A > MODULE.bazel

      - name: Test
        run: |
          set -euo pipefail
          # The default JVM heap is under 2 GB on 7 GB macOS runners.
          bazel --host_jvm_args=-Xmx4g test //... \
            --config=remote \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"

  build:
    permissions:
      contents: read
      # Needed to pull LLVM binaries as OCI artifacts from GHCR.
      packages: read
    runs-on: ${{ matrix.platform.os }}
    # We work with two git repositories in this workflow:
    #
    # - bpf-linker
    # - aya (for integration tests)
    #
    # Cargo searches for `.cargo` directories recursively in all parent
    # directories. Therefore, nesting different Rust projects with their own
    # `.cargo/config.toml` files in the same hierarchy (one nested in another)
    # causes cargo to read and merge both configurations.
    #
    # To avoid that, we clone both repositories in separate directories inside
    # the workspace.
    defaults:
      run:
        working-directory: bpf-linker
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - rust: 1.94.0
            llvm: 21
            exclude-features: default,llvm-22
          - rust: stable
            llvm: 22
            exclude-features: llvm-21
          - rust: beta
            llvm: 22
            exclude-features: llvm-21
        platform:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          # We don't use ubuntu-latest because we care about the apt packages available.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    name: target=${{ matrix.platform.target }} rustc=${{ matrix.toolchain.rust }} llvm=${{ matrix.toolchain.llvm }}
    needs:
      - prepare
      - llvm

    env:
      RUST_BACKTRACE: full
      # Features that have to be included for dynamic linking.
      LLVM_FEATURES_DYNAMIC: llvm-${{ matrix.toolchain.llvm }}
      # Features that have to be included for static linking.
      LLVM_FEATURES_STATIC: llvm-${{ matrix.toolchain.llvm }},llvm-link-static
      # Features that have to be excluded when running `cargo hack --feature-powerset`
      # and intending to link dynamically.
      LLVM_EXCLUDE_FEATURES_DYNAMIC: llvm-link-static,no-llvm-linking

    steps:
      - uses: actions/checkout@v7
        with:
          path: bpf-linker

      - name: Install Rust ${{ matrix.toolchain.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain.rust }}
          targets: ${{ matrix.platform.target }}
          components: rust-src

      - name: Add clang to PATH
        if: runner.os == 'Linux'
        # ubuntu-22.04 comes with clang 13-15[0]; support for signed and 64bit
        # enum values was added in clang 15[1] which isn't in `$PATH`.
        #
        # [0] https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2204-Readme.md
        #
        # [1] https://github.com/llvm/llvm-project/commit/dc1c43d
        run: echo /usr/lib/llvm-15/bin >> $GITHUB_PATH

      - name: Install FileCheck (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail

          brew bundle
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Enforce dynamic linking
        run: echo "RUSTFLAGS=-C target-feature=-crt-static" >> $GITHUB_ENV

      - name: Install btfdump
        run: cargo install btfdump

      - uses: oras-project/setup-oras@v2

      - name: Login to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          oras login ghcr.io --username "${{ github.actor }}" --password-stdin <<< "$GH_TOKEN"

      - name: Restore LLVM from ghcr.io
        env:
          LLVM_COMMIT: ${{ fromJSON(needs.prepare.outputs.llvm)[matrix.toolchain.llvm].commit }}
        run: |
          set -euxo pipefail
          ref="${{ env.TAG_PREFIX }}:${LLVM_COMMIT}-${{ matrix.platform.target }}-${{ env.LLVM_BUILD_REV }}"
          digest=$(oras manifest fetch "$ref" | jq -r '.layers[0].digest')
          LLVM_INSTALL_DIR="$(pwd)/llvm-install"
          mkdir -p "$LLVM_INSTALL_DIR"
          oras blob fetch "${ref}@${digest}" --output - | tar --zstd -xf - -C "$LLVM_INSTALL_DIR"
          echo "LLVM_PREFIX=${LLVM_INSTALL_DIR}/lib/llvm" >> "$GITHUB_ENV"
          echo "LIBLLVM_PREFIX=lib" >> "$GITHUB_ENV"
          echo "CXXSTDLIB=libcxx,libcxxabi" >> "$GITHUB_ENV"
          echo "CXXSTDLIB_PATH=${LLVM_INSTALL_DIR}/lib" >> "$GITHUB_ENV"
          echo "ZLIB=zlib" >> "$GITHUB_ENV"
          echo "ZLIB_PATH=${LLVM_INSTALL_DIR}/lib" >> "$GITHUB_ENV"
          echo "LIBZSTD_PATH=${LLVM_INSTALL_DIR}/lib" >> "$GITHUB_ENV"

      # llvm-sys discovers link flags at build script time; these are cached by cargo. The cached
      # flags may be incorrect when the cache is reused across LLVM versions.
      - name: Bust llvm-sys cache
        run: |
          set -euxo pipefail
          cargo clean --target ${{ matrix.platform.target }} -p llvm-sys
          cargo clean --target ${{ matrix.platform.target }} -p llvm-sys --release

      - name: Check (default features)
        if: matrix.toolchain.llvm == fromJSON(env.LATEST_LLVM)
        run: cargo check --target ${{ matrix.platform.target }}

      - name: Build (default features)
        if: matrix.toolchain.llvm == fromJSON(env.LATEST_LLVM)
        run: cargo build --target ${{ matrix.platform.target }}

      - uses: taiki-e/install-action@cargo-hack

      - name: Check (dynamic linking, feature powerset)
        run: |
          cargo hack --target ${{ matrix.platform.target }} \
            check --feature-powerset --exclude-features \
            ${{ env.LLVM_EXCLUDE_FEATURES_DYNAMIC }},${{ matrix.toolchain.exclude-features }},${{ matrix.platform.exclude-features }} \
            --features ${{ env.LLVM_FEATURES_DYNAMIC }}

      - name: Build (dynamic linking, feature powerset)
        run: |
          cargo hack --target ${{ matrix.platform.target }} \
            hack build --feature-powerset --exclude-features \
            ${{ env.LLVM_EXCLUDE_FEATURES_DYNAMIC }},${{ matrix.toolchain.exclude-features }},${{ matrix.platform.exclude-features }} \
            --features ${{ env.LLVM_FEATURES_DYNAMIC }}

      # Toolchains provided by rustup include standard library artifacts
      # only for Tier 1 targets, which do not include BPF targets.
      #
      # The default workaround is to use the `rustc-build-sysroot` crate to
      # build a custom sysroot with the required BPF standard library before
      # running compiler tests.
      #
      # `RUSTC_BOOTSTRAP` is needed to use `rustc-build-sysroot` on stable Rust.
      - name: Test (sysroot built on demand, dynamic linking)
        run: |
          RUSTC_BOOTSTRAP=1 cargo hack --target ${{ matrix.platform.target }} \
            test --feature-powerset --exclude-features \
            ${{ env.LLVM_EXCLUDE_FEATURES_DYNAMIC }},${{ matrix.toolchain.exclude-features }},${{ matrix.platform.exclude-features }} \
            --features ${{ env.LLVM_FEATURES_DYNAMIC }}

      # To make things easier for package maintainers, the step of building a
      # custom sysroot can be skipped by setting the `BPFEL_SYSROOT_DIR`
      # environment variable to the path of the prebuilt BPF sysroot.
      #
      # Test this configuration by prebuilding the BPF standard library
      # manually.
      #
      # `RUSTC_BOOTSTRAP` is needed to make `xtask build-std` work on stable
      # Rust.
      - name: Build BPF standard library
        run: |
          set -euxo pipefail

          RUSTC_SRC="$(rustc --print sysroot)/lib/rustlib/src/rust/library"
          BPFEL_SYSROOT_DIR="$(pwd)/bpf-sysroot"
          RUSTC_BOOTSTRAP=1 cargo xtask build-std \
            --rustc-src "$RUSTC_SRC" \
            --sysroot-dir "$BPFEL_SYSROOT_DIR" \
            --target bpfel-unknown-none

      - name: Test (prebuilt BPF standard libary, dynamic linking)
        run: |
          BPFEL_SYSROOT_DIR="$(pwd)/bpf-sysroot" \
            cargo hack --target ${{ matrix.platform.target }} test \
            --feature-powerset --exclude-features \
            ${{ env.LLVM_EXCLUDE_FEATURES_DYNAMIC }},${{ matrix.toolchain.exclude-features }},${{ matrix.platform.exclude-features }} \
            --features ${{ env.LLVM_FEATURES_DYNAMIC }}

      - uses: actions/checkout@v7
        if: runner.os == 'Linux' && matrix.toolchain.rust == 'stable'
        with:
          repository: aya-rs/aya
          path: aya
          submodules: recursive

      - name: Install (dynamic)
        if: endsWith(matrix.platform.target, 'gnu') && matrix.toolchain.rust == 'stable'
        run: |
          cargo install --path . --no-default-features --features \
            ${{ env.LLVM_FEATURES_DYNAMIC }}

      - name: Install autopoint for aya integration tests
        if: runner.os == 'Linux' && matrix.toolchain.rust == 'stable'
        run: sudo apt -y install autopoint

      - name: Run aya integration tests
        if: runner.os == 'Linux' && matrix.toolchain.rust == 'stable'
        working-directory: aya
        env:
          RUST_NIGHTLY: ${{ needs.prepare.outputs.rust-nightly }}
        run: |
          set -euo pipefail

          rustup toolchain install "$RUST_NIGHTLY" \
            --component rust-src --profile minimal --no-self-update
          # Aya invokes `nightly` internally; keep stable as the default.
          ln -s "$(rustup run "$RUST_NIGHTLY" rustc --print sysroot)" \
            "$(rustup show home)/toolchains/nightly-$(rustup run "$RUST_NIGHTLY" rustc --print host-tuple)"
          cargo xtask integration-test local

      - name: Enforce static linking
        # Static linking with glibc is not supported.
        if: ${{ !endsWith(matrix.platform.target, 'gnu') }}
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV

      - name: Check (static linking, single feature set)
        if: ${{ !endsWith(matrix.platform.target, 'gnu') }}
        # Static linking in combination with `cargo hack --feature-powerset`
        # (multiple builds) increases the disk usage massively. Therefore we
        # perform all static builds with only one fixed feature set.
        run: |
          cargo check --target ${{ matrix.platform.target }} \
            --no-default-features --features ${{ env.LLVM_FEATURES_STATIC }}

      - name: Build (static linking, single feature set)
        if: ${{ !endsWith(matrix.platform.target, 'gnu') }}
        run: |
          cargo build --target ${{ matrix.platform.target }} \
            --no-default-features --features ${{ env.LLVM_FEATURES_STATIC }}

      - name: Test (sysroot built on demand, static linking)
        if: ${{ !endsWith(matrix.platform.target, 'gnu') }}
        run: |
          RUSTC_BOOTSTRAP=1 cargo test --target ${{ matrix.platform.target }} \
            --no-default-features --features ${{ env.LLVM_FEATURES_STATIC }}

      - name: Test (prebuilt BPF standard library, static linking)
        if: ${{ !endsWith(matrix.platform.target, 'gnu') }}
        run: |
          BPFEL_SYSROOT_DIR="$(pwd)/bpf-sysroot" \
            cargo test --target ${{ matrix.platform.target }} \
            --no-default-features --features ${{ env.LLVM_FEATURES_STATIC }}

      - name: Report disk usage
        if: ${{ always() }}
        uses: ./bpf-linker/.github/actions/report-disk-usage

  release:
    name: release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      # Upload published GitHub release assets.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Apply the rustc LLVM candidate
        if: needs.prepare.outputs.module != ''
        env:
          MODULE: ${{ needs.prepare.outputs.module }}
        run: printf '%s' "$MODULE" | openssl base64 -d -A > MODULE.bazel

      - name: Build release
        run: |
          set -euo pipefail

          bazel build //:release-archives \
            --config=release \
            --config=remote \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"

          mkdir -p dist
          # Rename bazel-out/<target>-opt-.../bin/bpf-linker-release[-debuginfo].tar.zst
          # to dist/bpf-linker-<target>[-debuginfo].tar.zst.
          while IFS= read -r src; do
            relative="${src#bazel-out/}"
            target="${relative%%-opt*}"
            archive_name="${src##*/}"
            archive_suffix="${archive_name#bpf-linker-release}"
            install -m 0644 "$src" "dist/bpf-linker-${target}${archive_suffix}"
          done < <(bazel cquery //:release-archives \
            --output=files \
            --config=release \
            --config=remote)

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*

  check:
    if: always()
    needs:
      - prepare
      - lint-stable
      - lint-nightly
      - bazel
      - build
      - release
    runs-on: ubuntu-latest
    # Keep Crabby's token scoped to a default-branch promotion candidate.
    environment: >-
      ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          needs.prepare.outputs.module != '' && 'nightly-promotion' || 'ci' }}
    permissions:
      # Let forks update an unprotected default branch with their own token.
      contents: write
    steps:
      - name: Verify all required jobs succeeded
        env:
          JOBS: ${{ toJSON(needs) }}
        run: jq --exit-status 'length > 0 and all(.[]; .result == "success")' <<< "$JOBS"

      # Publish only after the complete CI matrix succeeds.
      - name: Promote the validated rustc LLVM
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          needs.prepare.outputs.module != ''
        env:
          BASE_COMMIT: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Prefer Crabby for protected branches; forks use their own token.
          GH_TOKEN: ${{ secrets.CRABBY_GITHUB_TOKEN || github.token }}
          LLVM_COMMIT: ${{ needs.prepare.outputs.llvm-commit }}
          MODULE: ${{ needs.prepare.outputs.module }}
          RUST_NIGHTLY: ${{ needs.prepare.outputs.rust-nightly }}
        run: |
          set -euo pipefail

          # Compare-and-swap the tested commit, not just the LLVM: a merge
          # starts a new default-branch run that must validate the candidate.
          jq -n \
            --arg module "$MODULE" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$DEFAULT_BRANCH" \
            --arg expected "$BASE_COMMIT" \
            --arg headline "Update rustc LLVM to ${RUST_NIGHTLY#nightly-}" \
            --arg llvm "$LLVM_COMMIT" \
            '{
              query: "mutation AdvanceRustcLlvm($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repository,
                    branchName: $branch
                  },
                  expectedHeadOid: $expected,
                  message: {
                    headline: $headline,
                    body: "Match the validated Aya integration nightly to rustc LLVM commit\n\($llvm)."
                  },
                  fileChanges: {
                    additions: [
                      {path: "MODULE.bazel", contents: $module}
                    ]
                  }
                }
              }
            }' |
            gh api graphql --input - \
              --jq '.data.createCommitOnBranch.commit | "\(.oid) \(.url)"'
