name: Update rustc LLVM

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: update-rustc-llvm

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for an open rustc LLVM update
        id: open-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          has_open_pr=$(gh pr list --state open --limit 1000 \
            --json headRefName,isCrossRepository \
            --jq 'any(.[]; (.isCrossRepository == false) and (.headRefName | startswith("automation/rustc-llvm-")))')
          echo "has_open_pr=$has_open_pr" >> "$GITHUB_OUTPUT"

      - name: Resolve the nightly rustc commit
        id: rustc
        if: steps.open-pr.outputs.has_open_pr == 'false'
        run: |
          set -euo pipefail

          rustc_commit=$(
            curl -fsSL --retry 5 https://static.rust-lang.org/dist/channel-rust-nightly.toml |
              python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["pkg"]["rustc"]["git_commit_hash"])'
          )
          [[ $rustc_commit =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$rustc_commit" >> "$GITHUB_OUTPUT"

      - name: Resolve the nightly rustc LLVM commit
        id: llvm
        if: steps.open-pr.outputs.has_open_pr == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUSTC_COMMIT: ${{ steps.rustc.outputs.commit }}
        run: |
          set -euo pipefail

          llvm_commit=$(gh api \
            "repos/rust-lang/rust/contents/src/llvm-project?ref=$RUSTC_COMMIT" \
            --jq 'select(.type == "submodule" and .submodule_git_url == "https://github.com/rust-lang/llvm-project.git") | .sha')
          [[ $llvm_commit =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$llvm_commit" >> "$GITHUB_OUTPUT"

      - name: Install Buildifier and Buildozer
        if: steps.open-pr.outputs.has_open_pr == 'false'
        run: |
          set -euo pipefail

          for tool in buildifier buildozer; do
            curl -fsSL --retry 5 \
              -o "$RUNNER_TEMP/$tool" \
              "https://github.com/bazelbuild/buildtools/releases/download/v8.5.1/$tool-linux-amd64"
            chmod +x "$RUNNER_TEMP/$tool"
          done

      - name: Check whether the nightly rustc LLVM needs an update
        id: update
        if: steps.open-pr.outputs.has_open_pr == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_COMMIT: ${{ steps.llvm.outputs.commit }}
        run: |
          set -euo pipefail

          llvm_archive_url="https://github.com/rust-lang/llvm-project/archive/$LLVM_COMMIT.tar.gz"
          current_urls=$("$RUNNER_TEMP/buildozer" 'print urls' '//MODULE.bazel:%llvm_source.from_archive')
          [[ $current_urls =~ ^\[https://github\.com/rust-lang/llvm-project/archive/([0-9a-f]{40})\.tar\.gz\]$ ]]
          if [[ $current_urls == "[$llvm_archive_url]" ]]; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="automation/rustc-llvm-$LLVM_COMMIT"
          has_prior_pr=$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls?state=all&head=$GITHUB_REPOSITORY_OWNER:$branch&per_page=1" \
            --jq 'length > 0')
          if [[ $has_prior_pr == true ]]; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'required=true' >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Update the rustc LLVM source
        if: steps.update.outputs.required == 'true'
        env:
          LLVM_COMMIT: ${{ steps.llvm.outputs.commit }}
        run: |
          set -euo pipefail

          llvm_archive_url="https://github.com/rust-lang/llvm-project/archive/$LLVM_COMMIT.tar.gz"
          archive="$RUNNER_TEMP/llvm-project.tar.gz"
          curl -fsSL --retry 5 -o "$archive" "$llvm_archive_url"
          llvm_version=$(tar -xOzf "$archive" \
            "llvm-project-$LLVM_COMMIT/cmake/Modules/LLVMVersion.cmake" | \
            sed -nE 's/^[[:space:]]*set\(LLVM_VERSION_(MAJOR|MINOR|PATCH)[[:space:]]+([0-9]+)\)[[:space:]]*$/\2/p' | \
            paste -sd .)
          [[ $llvm_version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          integrity="sha256-$(openssl dgst -sha256 -binary "$archive" | base64 -w0)"

          printf '%s\n' \
            "set llvm_version \"$llvm_version\"|//MODULE.bazel:%llvm_source.version" \
            "set integrity \"$integrity\"|set strip_prefix \"llvm-project-$LLVM_COMMIT\"|set urls [\"$llvm_archive_url\"]|//MODULE.bazel:%llvm_source.from_archive" | \
            "$RUNNER_TEMP/buildozer" -buildifier "$RUNNER_TEMP/buildifier" -f -

      - name: Test the rustc LLVM update
        if: steps.update.outputs.required == 'true'
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail

          env -u GH_TOKEN -u BUILDBUDDY_API_KEY bazel test //... \
            --config=remote \
            --remote_header=x-buildbuddy-api-key="${BUILDBUDDY_API_KEY:?BUILDBUDDY_API_KEY is not configured}"
          git diff --check

      - name: Create a rustc LLVM update pull request
        if: steps.update.outputs.required == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: ${{ steps.update.outputs.branch }}
          add-paths: |
            MODULE.bazel
            MODULE.bazel.lock
          commit-message: |
            Update rustc LLVM

            Use the rust-lang/llvm-project commit from the latest Rust nightly.

            Validated with bazel test //... --config=remote.
          title: Update rustc LLVM
          body: |
            Use the rust-lang/llvm-project commit from the latest Rust nightly.

            Validated with bazel test //... --config=remote.
          draft: true
