name: Update Rust nightly

on:
  schedule:
    - cron: 00 3 * * *
  workflow_dispatch:

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: aya-rs/aya/.github/workflows/nightly-update.yml@e11d7c46483c168a20ddcb5fd5aeb10595dede5e
    with:
      updater-script: scripts/update-rustc-llvm.py
