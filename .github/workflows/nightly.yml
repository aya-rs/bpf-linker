name: Update toolchains and workflow dependencies

on:
  pull_request:
    paths:
      - .github/workflows/actions.lock
      - .github/workflows/nightly.yml

  push:
    branches:
      - main

  schedule:
    - cron: 00 3 * * *
  workflow_dispatch:

jobs:
  resolve:
    permissions:
      contents: read
    # Shared Rust channel discovery (aya-rs/aya#1688).
    # gh-actions-lock v0.2.0 does not lock external reusable workflows.
    uses: aya-rs/aya/.github/workflows/rust-toolchains.yml@2a07daa48ae467480d7a456710ecd6bc7b1dd6c8
    with:
      channels: stable beta nightly

  update:
    needs: resolve
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Keep one promotion running and only the newest promotion pending.
    concurrency: nightly-promotion
    # Only main can enter this environment and use its Crabby credential.
    environment: nightly-promotion
    steps:
      - uses: actions/checkout@v7

      - name: Update Rust toolchains and LLVM
        env:
          GH_TOKEN: ${{ github.token }}
          RUST_TOOLCHAINS: ${{ needs.resolve.outputs.rust-toolchains }}
        run: |
          set -euo pipefail

          candidate=$(python3 -B scripts/rustc-llvm.py update "$RUST_TOOLCHAINS")
          if [[ -n "$candidate" ]]; then
            bazel mod deps --lockfile_mode=update
          fi

      - name: Refresh locked workflow dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --no-interactive --relock --no-narrow --no-migrate-local-actions

      - name: Create or update the dependency pull request
        id: pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          # GitHub requires approval before GITHUB_TOKEN-created PRs run CI.
          # Crabby starts required checks automatically so updates auto-merge.
          # Forks use GITHUB_TOKEN and approve their checks manually.
          token: ${{ secrets.CRABBY_GITHUB_TOKEN || github.token }}
          branch: create-pull-request/rust-nightly
          add-paths: |
            MODULE.bazel
            MODULE.bazel.lock
            .github/workflows/actions.lock
          commit-message: Update toolchains and workflow dependencies
          title: Update toolchains and workflow dependencies
          body: Update Rust stable, beta, and nightly pins, their LLVM selections, and locked workflow dependencies when needed.

      - name: Enable auto-merge
        # Forks do not receive the Crabby token required for auto-merge.
        if: >-
          !github.event.repository.fork &&
          steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.CRABBY_GITHUB_TOKEN }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.pull-request-number }}
        run: gh pr merge "$PULL_REQUEST" --auto --rebase
