name: LLVM archives

on:
  workflow_call:
    inputs:
      major:
        required: true
        type: string
      commit:
        required: true
        type: string
      targets:
        required: true
        type: string
      build-revision:
        required: true
        type: string

permissions: {}

env:
  LLVM_MAJOR: ${{ inputs.major }}
  LLVM_COMMIT: ${{ inputs.commit }}
  LLVM_TARGETS: ${{ inputs.targets }}
  LLVM_BUILD_REV: ${{ inputs.build-revision }}
  TAG_PREFIX: ghcr.io/${{ github.repository_owner }}/llvm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: oras-project/setup-oras@v2

      - name: Login to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"

      - name: Check LLVM artifacts
        id: artifact-restore
        run: |
          set -euxo pipefail
          missing=false
          for target in $LLVM_TARGETS; do
            ref="${TAG_PREFIX}:${LLVM_COMMIT}-${target}-${LLVM_BUILD_REV}"
            if output=$(oras manifest fetch --descriptor "$ref" 2>&1); then
              continue
            fi
            # ORAS uses the same exit status for missing manifests and registry
            # errors. Rebuild only when GHCR explicitly reports a cache miss.
            if [[ $output != *": not found" ]]; then
              printf '%s\n' "$output" >&2
              exit 1
            fi
            missing=true
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.artifact-restore.outputs.missing == 'true'
        with:
          persist-credentials: false

      - name: Build and package LLVM with Bazel
        if: steps.artifact-restore.outputs.missing == 'true'
        # A PR consumer only retrieves the archive for its own target.
        run: >-
          python3 -B scripts/rustc-llvm.py build-archives "$LLVM_MAJOR" //:llvm-archives
          ${{ github.event_name == 'pull_request' && '--remote_download_minimal' || '' }}

      - uses: actions/upload-artifact@v7
        id: upload
        if: steps.artifact-restore.outputs.missing == 'true' && github.event_name != 'pull_request'
        with:
          name: llvm-${{ inputs.major }}-${{ github.run_attempt }}
          path: bazel-bin/llvm-archive-*.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    if: >-
      ((github.event_name == 'push' || github.event_name == 'schedule') &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'release' && needs.build.outputs.artifact-id != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
    steps:
      - uses: oras-project/setup-oras@v2

      - name: Login to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"

      - uses: actions/download-artifact@v8
        if: env.ARTIFACT_ID != ''
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}

      - name: Publish LLVM
        run: |
          set -euo pipefail
          for target in $LLVM_TARGETS; do
            ref="${TAG_PREFIX}:${LLVM_COMMIT}-${target}-${LLVM_BUILD_REV}"
            if [[ -n $ARTIFACT_ID ]]; then
              oras push "$ref" \
                --artifact-type application/vnd.aya.llvm.install \
                "llvm-archive-${target}.tar.zst:application/vnd.aya.llvm.install.layer.v1.tar+zstd"
            fi
            if [[ $GITHUB_EVENT_NAME != release ]]; then
              oras tag "$ref" "${TAG_PREFIX}:${LLVM_MAJOR}-${target}-${LLVM_BUILD_REV}"
            fi
          done
